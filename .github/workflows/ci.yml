name: CI

on:
  push:
    branches: ["main", "task/**", "subtask/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: taskflow_test, POSTGRES_USER: testuser, POSTGRES_PASSWORD: testpass}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -v --tb=short
        env: {DATABASE_URL: "postgresql+asyncpg://testuser:testpass@localhost/taskflow_test", SECRET_KEY: test-secret}
